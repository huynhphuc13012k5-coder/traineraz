<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blueadz - Premium Pokémon Wallpapers</title>
    <style>
        /* === BIẾN MÀU SẮC & GIAO DIỆN CAO CẤP === */
        :root {
            --bg-gradient: linear-gradient(135deg, #030712, #0b1539, #1e1b4b, #111827);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.07);
            --input-bg: rgba(255, 255, 255, 0.05);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary-gradient: linear-gradient(135deg, #3b82f6, #6366f1);
            --primary-hover: linear-gradient(135deg, #60a5fa, #818cf8);
            --glow-color: rgba(99, 102, 241, 0.25);
            --ad-bg: rgba(15, 23, 42, 0.6);
            --ad-border: rgba(99, 102, 241, 0.4);
            --glass-blur: blur(16px);
        }

        .light-mode {
            --bg-gradient: linear-gradient(135deg, #f8fafc, #e0e7ff, #e2e8f0);
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(99, 102, 241, 0.15);
            --input-bg: rgba(255, 255, 255, 0.9);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary-gradient: linear-gradient(135deg, #1d4ed8, #4f46e5);
            --primary-hover: linear-gradient(135deg, #2563eb, #6366f1);
            --glow-color: rgba(79, 70, 229, 0.15);
            --ad-bg: rgba(241, 245, 249, 0.8);
            --ad-border: rgba(79, 70, 229, 0.3);
            --glass-blur: blur(10px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            transition: background 0.4s, color 0.4s;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* === HEADER & KHU VỰC ĐIỀU KHIỂN === */
        header {
            padding: 40px 20px 20px;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(to right, #60a5fa, #a5b4fc, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 15px rgba(99, 102, 241, 0.5));
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        input, select, .btn-action {
            padding: 14px 20px;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            outline: none;
            font-size: 0.95rem;
            background: var(--input-bg);
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"] {
            flex-grow: 1;
            min-width: 280px;
        }
        input[type="text"]:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 12px var(--glow-color);
            background: var(--input-bg);
        }

        select option {
            background: #0f172a;
            color: #fff;
        }
        .light-mode select option {
            background: #fff;
            color: #334155;
        }

        .btn-action {
            background: var(--input-bg);
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-action:hover {
            background: var(--card-border);
            transform: translateY(-2px);
        }

        /* === KHÔNG GIAN QUẢNG CÁO HIỆN ĐẠI === */
        .ad-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            width: 100%;
        }

        .ad-box {
            width: 100%;
            background: var(--ad-bg);
            border: 1px dashed var(--ad-border);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.05);
        }

        .ad-link {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: inherit;
        }

        .ad-top {
            height: auto;
            min-height: 90px;
            font-size: 0.9rem;
            padding: 10px;
            border: none;
            background: transparent;
            box-shadow: none;
        }

        .ad-card {
            background: var(--ad-bg);
            border: 2px dashed var(--ad-border);
            grid-column: span 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0; /* Padding bằng 0 để iframe quảng cáo phủ kín viền */
            color: var(--text-muted);
            border-radius: 24px;
            min-height: 340px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            position: relative;
            overflow: hidden;
        }

        .ad-bottom-sticky {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 30px);
            max-width: 800px;
            height: 70px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 18px;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            padding: 0 50px 0 20px;
            text-align: center;
        }
        
        .close-ad-btn {
            position: absolute;
            right: 15px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }
        .close-ad-btn:hover { background: rgba(255,255,255,0.2); }

        /* === GALLERY GRID CAO CẤP === */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: start; 
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 20px 40px var(--glow-color);
        }

        .card-img-wrapper {
            width: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.2) 100%);
            overflow: hidden;
            position: relative;
            cursor: zoom-in; 
        }

        .card img {
            width: 100%; 
            height: auto; 
            display: block; 
            object-fit: cover;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .card:hover img {
            transform: scale(1.08) rotate(2deg);
        }

        .card-info {
            padding: 24px;
            text-align: center;
            background: linear-gradient(to top, rgba(0,0,0,0.3), transparent);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: capitalize;
            letter-spacing: 0.5px;
        }

        /* === NÚT BẤM SIÊU CẤP === */
        .btn-download {
            background: var(--primary-gradient);
            color: #ffffff;
            padding: 14px 28px;
            width: 100%;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-download::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.6s ease;
        }

        .btn-download:hover::before { left: 100%; }
        .btn-download:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5);
        }

        /* === MÀN HÌNH CHUYỂN HƯỚNG QUẢNG CÁO === */
        .ad-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.98);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .ad-modal.active { display: flex; }

        .mock-ad-content {
            background: transparent; /* Loại bỏ nền tối để ảnh banner hiển thị đẹp */
            width: 100%;
            max-width: 640px;
            height: 360px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .countdown-text {
            font-size: 1.3rem;
            margin-bottom: 25px;
            color: #60a5fa;
            font-weight: 600;
        }
        .btn-real-download {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 16px 40px;
            font-size: 1.15rem;
            border-radius: 16px;
            cursor: pointer;
            border: none;
            display: none;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            transition: all 0.3s;
        }
        .btn-real-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.6);
        }

        /* === MODAL XEM TRƯỚC ẢNH === */
        .preview-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: zoom-out;
        }
        .preview-modal.active { display: flex; }
        .preview-modal img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: default;
        }
        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .close-preview {
            position: absolute;
            top: 25px; right: 35px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: color 0.3s;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .close-preview:hover { color: #f43f5e; }

        /* Tối ưu hóa đa thiết bị */
        @media (max-width: 768px) {
            .controls { flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; }
            input[type="text"], select, .btn-action { width: 100%; padding: 12px 16px; }
            .logo { font-size: 2.2rem; margin-bottom: 15px; }
            header { padding: 20px 10px; }
            .gallery { gap: 20px; padding: 10px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
            .ad-bottom-sticky { font-size: 0.8rem; height: 60px; bottom: 10px; }
            .close-preview { top: 15px; right: 20px; font-size: 35px; }
        }
    </style>
</head>

            <iframe srcdoc="<style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:transparent;overflow:hidden;}</style><script async='async' data-cfasync='false' src='https://pl28380548.effectivecpmnetwork.com/7e2d82f6a06f1d1af35df8cc14d6a654/invoke.js'></script><div id='container-7e2d82f6a06f1d1af35df8cc14d6a654'></div>" style="width:100%; height:100%; border:none;" scrolling="no"></iframe>

    <script>
        // =========================================================================
        // HỆ THỐNG ĐA NGÔN NGỮ (DICTIONARY)
        // =========================================================================
        const i18n = {
            vi: {
                searchPlaceholder: "Tìm tên hoặc mã Pokedex (VD: 25 hoặc Pikachu)...",
                themeToggle: "Chế độ Sáng/Tối",
                langToggle: "English",
                adSticky: "Hỗ trợ duy trì website bằng cách click quảng cáo",

                adModalCountdown: "Hệ thống đang chuẩn bị tệp hình ảnh 4K... ({time}s)",

                alertEmpty: "Khung này chưa được thiết lập link ảnh thật trong code script!",
                allTypes: "Tất cả Hệ",
                allGens: "Tất cả Thế hệ",
                gens: ["Thế hệ 1", "Thế hệ 2", "Thế hệ 3", "Thế hệ 4", "Thế hệ 5", "Thế hệ 6", "Thế hệ 7", "Thế hệ 8", "Thế hệ 9"],
                types: {
                    Normal: "Normal (Thường)", Fire: "Fire (Lửa)", Water: "Water (Nước)", Grass: "Grass (Cỏ)",
                    Electric: "Electric (Điện)", Ice: "Ice (Băng)", Fighting: "Fighting (Đấu sĩ)", Poison: "Poison (Độc)",
                    Ground: "Ground (Đất)", Flying: "Flying (Bay)", Psychic: "Psychic (Siêu linh)", Bug: "Bug (Bọ)",
                    Rock: "Rock (Đá)", Ghost: "Ghost (Ma)", Dragon: "Dragon (Rồng)", Dark: "Dark (Bóng tối)",
                    Steel: "Steel (Thép)", Fairy: "Fairy (Tiên)"
                }
            },
            en: {
                searchPlaceholder: "Search by name or Pokedex ID (e.g., 25 or Pikachu)...",
                themeToggle: "Light/Dark Mode",
                langToggle: "Tiếng Việt",
                adSticky: "Support our website by clicking ads",
                btnDownload: "Download Wallpaper",
                noData: "No matching data found.",
                placeholderText: "✨ Empty Slot Template (No URL set)",
                adModalCountdown: "System is preparing the 4K image file... ({time}s)",
                adModalBtn: "⚡ Download Now",
                adText: "Sponsored",
                alertEmpty: "This template slot does not have an image URL configured yet!",
                allTypes: "All Types",
                allGens: "All Generations",
                gens: ["Generation 1", "Generation 2", "Generation 3", "Generation 4", "Generation 5", "Generation 6", "Generation 7", "Generation 8", "Generation 9"],
                types: {
                    Normal: "Normal", Fire: "Fire", Water: "Water", Grass: "Grass",
                    Electric: "Electric", Ice: "Ice", Fighting: "Fighting", Poison: "Poison",
                    Ground: "Ground", Flying: "Flying", Psychic: "Psychic", Bug: "Bug",
                    Rock: "Rock", Ghost: "Ghost", Dragon: "Dragon", Dark: "Dark",
                    Steel: "Steel", Fairy: "Fairy"
                }
            }
        };

        let currentLang = 'vi';

        // =========================================================================
        // DANH SÁCH DỮ LIỆU HÌNH NỀN
        // =========================================================================
        const wallpapers = [
            { id: 1, name: 'Bulbasaur', type: 'Grass', gen: 1, img: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png' },
            { id: 6, name: 'Charizard', type: 'Fire', gen: 1, img: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png' },
            { id: 25, name: 'Pikachu', type: 'Electric', gen: 1, img: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png' },
            { id: 150, name: 'Mewtwo', type: 'Psychic', gen: 1, img: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/150.png' },
            { id: 384, name: 'Rayquaza', type: 'Dragon', gen: 3, img: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/384.png' },
            { id: 658, name: 'Greninja', type: 'Water', gen: 6, img: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/658.png' },
            { id: 906, name: 'Sprigatito', type: 'Grass', gen: 9, img: '' }
        ];

        // === DOM ELEMENTS ===
        const gallery = document.getElementById('gallery');
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');
        const genFilter = document.getElementById('genFilter');
        const themeToggle = document.getElementById('themeToggle');
        const langToggle = document.getElementById('langToggle');
        
        const adModal = document.getElementById('adModal');
        const countdownText = document.getElementById('countdownText');
        const btnRealDownload = document.getElementById('btnRealDownload');

        let currentDownloadUrl = "";
        let currentDownloadName = "";
        let countdownInterval;

        // === THAY ĐỔI CẤU HÌNH NGÔN NGỮ ===
        function updateLanguageUI() {
            const langData = i18n[currentLang];
            
            searchInput.placeholder = langData.searchPlaceholder;
            document.getElementById('text-theme').innerText = langData.themeToggle;
            document.getElementById('text-lang').innerText = currentLang === 'vi' ? 'English' : 'Tiếng Việt';
            document.getElementById('ad-sticky-text').innerText = langData.adSticky;
            btnRealDownload.innerText = langData.adModalBtn;

            const currentTypeValue = typeFilter.value || 'all';
            typeFilter.innerHTML = `<option value="all">${langData.allTypes}</option>`;
            Object.keys(langData.types).forEach(key => {
                typeFilter.innerHTML += `<option value="${key}">${langData.types[key]}</option>`;
            });
            typeFilter.value = currentTypeValue;

            const currentGenValue = genFilter.value || 'all';
            genFilter.innerHTML = `<option value="all">${langData.allGens}</option>`;
            for(let i = 1; i <= 9; i++) {
                genFilter.innerHTML += `<option value="${i}">${langData.gens[i-1]}</option>`;
            }
            genFilter.value = currentGenValue;
        }

        // === TÍNH NĂNG XEM TRƯỚC ẢNH ===
        window.openPreview = function(imgSrc) {
            if(!imgSrc || imgSrc === 'none' || imgSrc === '') return;
            const modal = document.getElementById('previewModal');
            const previewImg = document.getElementById('previewImage');
            previewImg.src = imgSrc;
            modal.classList.add('active');
        }

        window.closePreview = function() {
            const modal = document.getElementById('previewModal');
            modal.classList.remove('active');
            setTimeout(() => { document.getElementById('previewImage').src = ''; }, 300);
        }

        // === RENDER GALLERY (CHÈN QUẢNG CÁO MỖI 3 ẢNH) ===
        function renderGallery(data) {
            gallery.innerHTML = '';
            const langData = i18n[currentLang];

            if (data.length === 0) {
                gallery.innerHTML = `<p style="text-align:center; grid-column: 1/-1; padding: 40px; color: var(--text-muted); font-weight:600;">${langData.noData}</p>`;
                return;
            }

            data.forEach((poke, index) => {
                const formattedId = poke.id.toString().padStart(3, '0');
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper" onclick="openPreview('${poke.img}')" title="Nhấn để xem đầy đủ">
                        <img src="${poke.img || 'none'}" alt="${poke.name}" loading="lazy" 
                             onerror="this.onerror=null; this.src='https://placehold.co/600x600/1e1b4b/60a5fa?text=${encodeURIComponent(langData.placeholderText)}'">
                    </div>
                    <div class="card-info">
                        <div class="card-title">#${formattedId} - ${poke.name}</div>
                        <button class="btn-download" onclick="triggerAdRedirect('${poke.img}', '${poke.name}')">
                            <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
                            ${langData.btnDownload}
                        </button>
                    </div>
                `;
                gallery.appendChild(card);

                // CHÈN QUẢNG CÁO CỦA BẠN MỖI 3 ẢNH BẰNG IFRAME (Khắc phục lỗi chạy code Script bằng InnerHTML)
                if ((index + 1) % 3 === 0) {
                    const adCard = document.createElement('div');
                    adCard.className = 'ad-card';
                    
                    // Đoạn string mã quảng cáo nhúng 
                    const iframeContent = `<style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:transparent;overflow:hidden;}</style><script async="async" data-cfasync="false" src="https://pl28380548.effectivecpmnetwork.com/7e2d82f6a06f1d1af35df8cc14d6a654/invoke.js"><\/script><div id="container-7e2d82f6a06f1d1af35df8cc14d6a654"></div>`;
                    
                    adCard.innerHTML = `<iframe srcdoc='${iframeContent}' style="width:100%; height:100%; min-height:340px; border:none;" scrolling="no"></iframe>`;
                    
                    gallery.appendChild(adCard);
                }
            });
        }

        // === LỌC VÀ TÌM KIẾM ===
        function filterWallpapers() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const selectedType = typeFilter.value;
            const selectedGen = genFilter.value;

            const filteredData = wallpapers.filter(poke => {
                const matchSearch = poke.name.toLowerCase().includes(searchTerm) || poke.id.toString() === searchTerm;
                const matchType = selectedType === 'all' || poke.type === selectedType;
                const matchGen = selectedGen === 'all' || poke.gen.toString() === selectedGen;

                return matchSearch && matchType && matchGen;
            });

            renderGallery(filteredData);
        }

        searchInput.addEventListener('input', filterWallpapers);
        typeFilter.addEventListener('change', filterWallpapers);
        genFilter.addEventListener('change', filterWallpapers);

        // === XỬ LÝ QUẢNG CÁO KHI DOWNLOAD ===
        window.triggerAdRedirect = function(imgUrl, pokeName) {
            const langData = i18n[currentLang];
            if(!imgUrl || imgUrl === '') {
                alert(langData.alertEmpty);
                return;
            }
            currentDownloadUrl = imgUrl;
            currentDownloadName = pokeName;
            
            adModal.classList.add('active');
            btnRealDownload.style.display = 'none';
            countdownText.style.display = 'block';
            
            let timeLeft = 5; 
            countdownText.innerText = langData.adModalCountdown.replace("{time}", timeLeft);

            countdownInterval = setInterval(() => {
                timeLeft--;
                countdownText.innerText = langData.adModalCountdown.replace("{time}", timeLeft);
                
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    countdownText.style.display = 'none';
                    btnRealDownload.style.display = 'block'; 
                }
            }, 1000);
        }

        btnRealDownload.addEventListener('click', () => {
            fetch(currentDownloadUrl)
                .then(response => response.blob())
                .then(blob => {
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = `Blueadz_${currentDownloadName}.png`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                })
                .catch(err => {
                    window.open(currentDownloadUrl, '_blank');
                });

            adModal.classList.remove('active');
        });

        // === ĐIỀU KHIỂN ĐỔI NGÔN NGỮ & THEME ===
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'vi' ? 'en' : 'vi';
            updateLanguageUI();
            filterWallpapers();
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
        });

        // Khởi động trang web ban đầu
        updateLanguageUI();
        renderGallery(wallpapers);
    </script>
